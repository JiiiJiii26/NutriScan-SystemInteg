# ===========================================================
# NutriScan Spring Boot Configuration - Increment 1
# ===========================================================

# Application Name & Port
spring.application.name=nutriscan
server.port=8080

# -----------------------------------------------------------
# 1. PostgreSQL Database Configuration
# -----------------------------------------------------------
# Replace with your PostgreSQL host, port, and database name
spring.datasource.url=jdbc:postgresql://localhost:5432/nutriscan_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Settings
# 'update' automatically updates table schema while preserving existing data
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Execute schema.sql on application startup
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# -----------------------------------------------------------
# 2. Google OAuth 2.0 Client Credentials
# -----------------------------------------------------------
# Create these credentials at Google Cloud Console (https://console.cloud.google.com/)
# Authorized redirect URI: http://localhost:8080/login/oauth2/code/google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:YOUR_GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:YOUR_GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# -----------------------------------------------------------
# 3. HTTP Session & Cookie Settings (Session-Based Auth)
# -----------------------------------------------------------
server.servlet.session.timeout=7d
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
# Set secure=false for local HTTP development (set true in production HTTPS)
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/
